services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: legalai
      POSTGRES_PASSWORD: legalai
      POSTGRES_DB: legalai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://legalai:legalai@db:5432/legalai
    ports:
      - "8000:8000"
    depends_on:
      - db
    volumes:
      - uploads:/app/uploads

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:
